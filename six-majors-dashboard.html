<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Six Majors · Marathon winners dashboard</title>
<link rel="icon" type="image/png" href="assets/Logos/Logo_Square.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--mode:dark;--bg:#080908;--dash:#121312;--card:#1a1b1a;--card2:#222322;--line:#2f312f;--ink:#f1f1f0;--ink2:#bcbcba;--ink3:#8a8a88;--men:#2fb860;--women:#a78bfa;--g:#2fb860;--on-g:#07130b;--ath:#f1f1f0;--ocean:#0a0b0a;--land:#2a2c2a;--border:#161716;--grat:rgba(241,241,240,.06);--halo:rgba(47,184,96,.20);--neutral:#bcbcba}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){color-scheme:light;--mode:light;--bg:#dcdcda;--dash:#f2f2f1;--card:#ffffff;--card2:#ebebea;--line:#d8d8d6;--ink:#111211;--ink2:#4f504f;--ink3:#767776;--men:#138a45;--women:#7c5ce0;--g:#138a45;--on-g:#ffffff;--ath:#111211;--ocean:#dfe2df;--land:#fafaf9;--border:#cfd0ce;--grat:rgba(17,18,17,.08);--halo:rgba(19,138,69,.16);--neutral:#4f504f}}
:root[data-theme="light"]{color-scheme:light;--mode:light;--bg:#dcdcda;--dash:#f2f2f1;--card:#ffffff;--card2:#ebebea;--line:#d8d8d6;--ink:#111211;--ink2:#4f504f;--ink3:#767776;--men:#138a45;--women:#7c5ce0;--g:#138a45;--on-g:#ffffff;--ath:#111211;--ocean:#dfe2df;--land:#fafaf9;--border:#cfd0ce;--grat:rgba(17,18,17,.08);--halo:rgba(19,138,69,.16);--neutral:#4f504f}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden;background:var(--bg)}
body{color:var(--ink);font:13px/1.4 Inter,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--g);outline-offset:2px}
.fit{position:fixed;left:50%;top:50%;width:1400px;height:800px;transform-origin:center center}
.dash{position:absolute;inset:0;background:var(--dash);border-radius:18px;overflow:hidden;box-shadow:0 0 0 1px var(--line)}
/* header */
.title{position:absolute;left:30px;top:24px;width:520px}
h1{font:700 36px/1.05 Fraunces,Georgia,serif;margin:0;letter-spacing:-.015em}
.sub{color:var(--ink2);font-size:13.5px;margin-top:8px}
.controls{position:absolute;left:30px;top:98px;display:flex;gap:8px;align-items:center;z-index:5}
.seg{display:inline-flex;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:2px}
.seg button{background:none;border:0;padding:5px 11px;border-radius:8px;color:var(--ink2);font-size:12px;font-weight:500}
.seg button[aria-pressed="true"]{background:var(--g);color:var(--on-g);font-weight:600}
.ibtn{background:var(--card);border:1px solid var(--line);border-radius:10px;height:32px;min-width:32px;padding:0 10px;color:var(--ink2);font-size:12px;font-weight:500}
.ibtn[aria-pressed="true"]{border-color:var(--g);color:var(--g)}
/* BANs */
.bans{position:absolute;left:590px;right:30px;top:24px;display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.ban{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px 16px 12px;position:relative;overflow:hidden;min-height:96px}
.ban::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--g)}
.ban .k{font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink3);font-weight:600;white-space:nowrap;display:flex;justify-content:space-between;gap:8px}
.ban .k em{font-style:normal;color:var(--g);letter-spacing:.04em;text-transform:none;font-weight:600;font-size:11px}
.ban .v{font:700 34px/1.1 Fraunces,Georgia,serif;margin-top:4px;white-space:nowrap}
.ban .s{font-size:12px;color:var(--ink2);margin-top:2px}
/* globe stage */
.stage{position:absolute;top:134px;left:370px;width:660px;height:620px;transition:left .85s cubic-bezier(.65,0,.25,1)}
.dash.open .stage{left:22px}
canvas{width:660px;height:620px;display:block;cursor:grab;touch-action:none;-webkit-tap-highlight-color:transparent}
canvas:active{cursor:grabbing}
.zoom{position:absolute;right:6px;bottom:4px;display:flex;flex-direction:column;gap:4px}
.zoom button{width:28px;height:28px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink2);font-size:15px;line-height:1}
.hint{position:absolute;left:30px;bottom:78px;color:var(--ink3);font-size:12px;pointer-events:none}
.chips{position:absolute;left:30px;bottom:34px;display:flex;gap:6px;z-index:5}
.chip{border:1px solid var(--line);background:var(--card);color:var(--ink2);padding:5px 12px;border-radius:999px;font-size:12px;font-weight:500}
.chip[aria-pressed="true"]{background:var(--g);color:var(--on-g);border-color:var(--g);font-weight:600}
.foot{position:absolute;left:30px;right:30px;bottom:10px;color:var(--ink3);font-size:10.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* pop-out panel */
.panel{position:absolute;left:700px;right:30px;top:142px;bottom:26px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 18px;display:flex;flex-direction:column;gap:10px;box-shadow:0 18px 50px rgba(0,0,0,.35);opacity:0;transform:translateX(60px);pointer-events:none;transition:opacity .45s ease .25s,transform .75s cubic-bezier(.2,.8,.2,1) .15s;z-index:4;overflow:hidden}
.dash.open .panel{opacity:1;transform:none;pointer-events:auto}
.ph{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.eyebrow{font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink3);font-weight:600}
h2{font:700 24px/1.1 Fraunces,Georgia,serif;margin:2px 0 1px;letter-spacing:-.01em}
.meta{color:var(--ink2);font-size:12.5px}
.x{background:var(--card2);border:1px solid var(--line);border-radius:10px;width:30px;height:30px;color:var(--ink2);font-size:14px;flex:0 0 auto}
.back{background:none;border:0;color:var(--ink2);padding:0 0 4px;font-size:12px;font-weight:500}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.tile{background:var(--card2);border:1px solid var(--line);border-radius:11px;padding:8px 10px;min-width:0}
.tile .k{font-size:10px;color:var(--ink3);text-transform:uppercase;letter-spacing:.07em;font-weight:600;white-space:nowrap}
.tile .v{font:700 20px/1.15 Fraunces,Georgia,serif;margin-top:2px;white-space:nowrap}
.tile .s{font-size:11.5px;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
h3{font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink3);margin:0 0 6px;font-weight:600;display:flex;justify-content:space-between;align-items:center;gap:8px;white-space:nowrap}
h3 .lg{display:flex;gap:11px;text-transform:none;letter-spacing:0;font-weight:500;font-size:11px;color:var(--ink2)}
h3 .lg span{display:inline-flex;align-items:center;gap:4px}
.lk{background:none;border:0;padding:0;font-weight:600;color:var(--ink);text-align:left;border-bottom:1px dotted var(--ink3);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;flex:0 0 auto}
.dot.m{background:var(--men)}.dot.w{background:var(--women)}
.sq{display:inline-block;width:8px;height:8px;background:var(--women);flex:0 0 auto}
.cc{font-size:10.5px;color:var(--ink3);font-weight:600;letter-spacing:.04em}
.tm{font-weight:600;color:var(--ink)}
.b{font-size:9.5px;font-weight:700;border:1px solid var(--ink2);color:var(--ink2);border-radius:4px;padding:0 4px;letter-spacing:.03em}
.b.wrb{color:var(--ink);border-color:var(--ink)}
.fl{color:var(--ink3);font-size:11px;cursor:help}
.scrub{display:flex;align-items:center;gap:10px}
.play{width:32px;height:32px;border-radius:50%;border:1px solid var(--g);background:none;color:var(--g);flex:0 0 auto;font-size:11px}
.scrub input{flex:1;min-width:0;accent-color:var(--g);height:22px}
.yl{font:700 22px Fraunces,Georgia,serif;min-width:54px;text-align:right}
.ycard{display:grid;gap:8px;margin-top:6px}
.ycard.c2{grid-template-columns:1fr 1fr}
.yc{background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:6px 10px;min-width:0;height:50px}
.yc .n{display:flex;align-items:center;gap:6px;min-width:0}
.yc .t{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--ink2);margin-top:2px;white-space:nowrap}
.yc.none{display:flex;align-items:center;font-style:italic;color:var(--ink2)}
#chart{position:relative;width:100%}
#chart svg{display:block;overflow:visible}
.two{display:grid;grid-template-columns:1fr 1fr;gap:20px;min-height:0}
.rows{display:flex;flex-direction:column;gap:1px}
.bar{display:grid;grid-template-columns:104px 1fr 24px;align-items:center;gap:8px;background:none;border:1px solid transparent;border-radius:7px;padding:2px 4px;text-align:left;width:100%;height:23px}
.bar[aria-pressed="true"]{border-color:var(--g);background:var(--card2)}
.bar .n{font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar .tr{display:flex;gap:2px;height:11px}
.bar .tr i{display:block;height:100%;min-width:3px;border-radius:0 4px 4px 0}
.bar .tr i.m{background:var(--men)}.bar .tr i.w{background:var(--women)}
.bar .c{text-align:right;font-weight:600;font-size:12px}
.bar.static{cursor:pointer}
.xchip{background:var(--card2);border:1px solid var(--g);border-radius:999px;padding:0 8px;font-size:10.5px;color:var(--g);text-transform:none;letter-spacing:0}
.empty{color:var(--ink3);font-size:12px;padding:6px 0}
.route{flex:1;min-height:0;overflow:auto;margin-top:0}
.rw{display:grid;grid-template-columns:46px 1fr auto;gap:8px;align-items:baseline;width:100%;background:none;border:0;border-top:1px solid var(--line);padding:6px 0;text-align:left}
.rw .cc{font-size:12px}
.tip{position:fixed;z-index:50;pointer-events:none;background:var(--card);border:1px solid var(--ink3);border-radius:10px;padding:7px 10px;font-size:12.5px;box-shadow:0 6px 24px rgba(0,0,0,.4);max-width:270px}
.tip[hidden]{display:none}
.tip .wr{display:flex;flex-wrap:wrap;gap:4px 8px;align-items:baseline;padding:2px 0}
</style>
</head>
<body>
<div class="fit" id="fit">
 <div class="dash" id="dash">
  <div class="title">
   <h1>The Six Majors</h1>
   <div class="sub">Marathon winners on a globe, 2000–2026 · click a pin to open a race</div>
  </div>
  <div class="controls">
   <div class="seg" id="segSex" role="group" aria-label="Show winners"><button data-sex="both" aria-pressed="true">Both</button><button data-sex="M" aria-pressed="false">Men</button><button data-sex="W" aria-pressed="false">Women</button></div>
   <div class="seg" id="segOrg" role="group" aria-label="Flag winners by"><button data-org="nat" aria-pressed="true">Nationality</button><button data-org="birth" aria-pressed="false">Birthplace</button></div>
   <button class="ibtn" id="rot" aria-pressed="true" title="Auto-rotate">⟳ Spin</button>
   <button class="ibtn" id="theme" aria-label="Toggle light and dark theme" title="Light / dark">◐ Theme</button>
  </div>
  <div class="bans" id="bans"></div>
  <div class="stage" id="stage">
   <canvas id="globe" width="660" height="620" role="img" aria-label="Interactive globe with the six World Marathon Majors. Use the race buttons to explore."></canvas>
   <div class="zoom"><button id="zin" aria-label="Zoom in">+</button><button id="zout" aria-label="Zoom out">−</button></div>
  </div>
  <div class="hint" id="hint"></div>
  <nav class="chips" id="chips" aria-label="Choose a race"></nav>
  <aside class="panel" id="panel" aria-live="polite"></aside>
  <div class="foot" id="foot"></div>
 </div>
</div>
<div class="tip" id="tip" hidden></div>

<script>// https://d3js.org v7.9.2 Copyright 2010-2026 Mike Bostock

let last=performance.now();

 const dt=Math.min(64,now-last);last=now;
 if(view.tw){const tw=view.tw,k=Math.min(1,(now-tw.t0)/tw.dur),e=ease(k);view.rot=[tw.f[0]+(tw.t[0]-tw.f[0])*e,tw.f[1]+(tw.t[1]-tw.f[1])*e];view.scale=tw.s0+(tw.s1-tw.s0)*e;if(k>=1)view.tw=null;view.dirty=true}

function rotateTo(ll,scale){

/* ---------- pointer interaction ---------- */
const ptrs=new Map();let drag=null,pinch=null;
const dist=()=>{const a=[...ptrs.values()];return Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y)};
function stopAuto(){view.auto=false;syncRot()}
canvas.addEventListener('pointerdown',e=>{canvas.setPointerCapture(e.pointerId);ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});view.tw=null;

 else if(ptrs.size===2){pinch={d:dist(),s:view.scale};drag=null}});

 const p=ptrs.get(e.pointerId);
 if(!p){hover(e);return}

 if(pinch&&ptrs.size===2){view.scale=Math.max(.6,Math.min(2.4,pinch.s*dist()/pinch.d));view.dirty=true;return}
 if(drag){const dx=(e.clientX-drag.x)/UI,dy=(e.clientY-drag.y)/UI;drag.x=e.clientX;drag.y=e.clientY;drag.moved+=Math.abs(dx)+Math.abs(dy);

function pinAt(e){const b=canvas.getBoundingClientRect(),x=(e.clientX-b.left)*W/b.width,y=(e.clientY-b.top)*H/b.height;let best=null,bd=1e9;hits.forEach(h=>{const d=Math.hypot(h.x-x,h.y-y);if(d<h.r&&d<bd){bd=d;best=h}});return best}

 if(!L.length)return '<div class="empty">No repeat winners up to this year.</div>';
 const max=L[0].n,shown=L.slice(0,limit),rest=L.length-shown.length;
 return '<div class="rows">'+shown.map(o=>`<button class="bar" data-act="athlete" data-name="${enc(o.name)}" title="${esc(o.name)}: ${o.n} wins"><span class="n">${esc(o.name)}</span><span class="tr"><i class="${o.sex==='M'?'m':'w'}" style="width:${o.n/max*100}%"></i></span><span class="c">${o.n}</span></button>`).join('')+'</div>'+(rest>0?`<div class="empty" style="padding:3px 4px 0">+ ${rest} more with 2 or more wins</div>`:'')}

/* ---------- panels ---------- */
function renderChips(){
 $('#chips').innerHTML=KEYS.map(k=>`<button class="chip" data-act="race" data-key="${k}" aria-pressed="${state.race===k}">${RACES[k].short}</button>`).join('')}

function renderPanel(){
 const P=$('#panel');
 if(state.athlete)P.innerHTML=athleteHTML();
 else if(state.race)P.innerHTML=raceHTML();
 else{P.innerHTML='';CH=null}
 if(state.race&&!state.athlete){drawChart();updateYearUI()}
 $('#foot').textContent='Marathon Majors winners, 2000–2026 · NYC 2020 (virtual) left out of the time charts · Birthplace falls back to nationality when not recorded';
}

function raceHTML(){
 const key=state.race,R=RACES[key],all=BYRACE[key],[y0,y1]=YEARS[key];
 const fm=fastest(all.filter(r=>r.sex==='M')),fw=fastest(all.filter(r=>r.sex==='W'));
 const mw=mostWins(all.filter(sexOK)),A=agg(all.filter(r=>!r.none&&sexOK(r)));
 const tf=r=>r?fmt(r.secs):'–',sf=r=>r?`${esc(r.name)} · ${r.year}`:'';
 return `<div class="ph"><div><div class="eyebrow">Marathon major</div><h2>${esc(R.name)}</h2><div class="meta">${R.n} editions in the data · ${y0}–${y1}</div></div><button class="x" data-act="close" aria-label="Close panel">✕</button></div>
 ${tiles([{k:'Fastest · men',v:tf(fm),s:sf(fm)},{k:'Fastest · women',v:tf(fw),s:sf(fw)},{k:'Most wins',v:mw?mw[1]:'–',s:mw?esc(mw[0]):''},{k:'Winning nations',v:A.length,s:A[0]?esc(A[0].c)+' lead with '+A[0].t:''}])}
 <div><h3><span>Time travel</span></h3>
  <div class="scrub"><button class="play" id="play" data-act="play" aria-label="Play through the years">▶</button><input type="range" id="yr" min="${y0}" max="${y1}" step="1" value="${state.year}" aria-label="Year"><div class="yl" id="yl">${state.year}</div></div>
  <div class="ycard" id="ycard"></div></div>
 <div><h3><span>Winning times</span><span class="lg">${sexes().map(s=>`<span>${mark(s)}${sexName(s)}</span>`).join('')}<span>◆ world record</span><span>○ course record</span><span>× no race</span></span></h3><div id="chart"></div></div>
 <div class="two"><div><h3><span>Where winners come from</span><span id="clr"></span></h3><div id="bars"></div></div>
 <div><h3><span>Repeat winners</span><span style="text-transform:none;letter-spacing:0;font-weight:500">wins up to <b id="yl2"></b></span></h3><div id="champs"></div></div></div>`;
}

function athleteHTML(){
 const a=ATH.get(state.athlete),w=a.wins,fast=fastest(w);
 const races=new Set(w.map(x=>x.race)),oc=state.org==='birth'&&a.birth?a.birth:a.nat;
 const bk=state.from?RACES[state.from].name:'Close';
 return `<div class="ph"><div><button class="back" data-act="back">← ${esc(bk)}</button><div class="eyebrow">${a.sex==='M'?'Men':'Women'} · ${esc(oc)}${a.birth&&a.birth!==a.nat?` (runs for ${esc(a.nat)})`:''}</div><h2>${esc(a.name)}</h2>
 <div class="meta">${w[0].year===w[w.length-1].year?w[0].year:w[0].year+'–'+w[w.length-1].year} · the dashed line follows ${w.length>1?'their wins in order':'the win'}, starting from ${esc(oc)}</div></div><button class="x" data-act="close" aria-label="Close panel">✕</button></div>
 ${tiles([{k:'Major wins',v:w.length,s:'in this data'},{k:'Different majors',v:races.size+' of 6',s:[...races].map(k=>RACES[k].short).join(', ')},{k:'Fastest win',v:fast?fmt(fast.secs):'–',s:fast?RACES[fast.race].short+' '+fast.year:''},{k:'First win',v:w[0].year,s:RACES[w[0].race].short}])}
 <div style="flex:1;min-height:0;display:flex;flex-direction:column"><h3>Every win</h3><div class="route">${w.slice().reverse().map(x=>`<button class="rw" data-act="race" data-key="${x.race}"><span class="cc">${x.year}</span><span><b>${RACES[x.race].name.replace(' Marathon','')}</b> ${badge(x)}</span><span class="tm">${x.virtual?'virtual':fmt(x.secs)}</span></button>`).join('')}</div></div>`;
}

/* ---------- race panel updates ---------- */
function updateYearUI(){
 const key=state.race;if(!key||state.athlete||!$('#ycard'))return;
 const yr=state.year,inp=$('#yr');
 $('#yl').textContent=yr;if(+inp.value!==yr)inp.value=yr;$('#yl2').textContent=yr;
 const rows=BYRACE[key].filter(r=>r.year===yr),none=rows.find(r=>r.none),ss=sexes();
 const yc=$('#ycard');yc.className='ycard'+(ss.length===2?' c2':'');
 if(none)yc.innerHTML=`<div class="yc none">No race — ${esc(none.note)}</div>`;
 else if(!rows.length)yc.innerHTML='<div class="yc none">No edition in this data.</div>';
 else yc.innerHTML=ss.map(s=>{const r=rows.find(x=>x.sex===s);if(!r)return `<div class="yc none">${sexName(s)} — not in data</div>`;
  return `<div class="yc"><div class="n">${mark(s)}<button class="lk" data-act="athlete" data-name="${enc(r.name)}">${esc(r.name)}</button></div><div class="t"><span>${sexName(s)}</span><span class="cc" title="${esc(r.nat)}${r.birth&&r.birth!==r.nat?', born in '+esc(r.birth):''}">${code(origin(r))}</span><span class="tm">${r.virtual?'virtual':fmt(r.secs)}</span>${badge(r)}</div></div>`}).join('');
 const upto=BYRACE[key].filter(r=>!r.none&&sexOK(r)&&r.year<=yr);
 $('#bars').innerHTML=barsHTML(upto,5);
 $('#clr').innerHTML=state.country?`<button class="xchip" data-act="country" data-c="${enc(state.country)}">${esc(state.country)} ✕</button>`:'';
 $('#champs').innerHTML=champsHTML(upto,5);
 drawYearMark();renderBans();
}

/* ---------- chart ---------- */
let CH=null;
function drawChart(){
 const el=$('#chart');if(!el)return;el.innerHTML='';
 const key=state.race,[y0,y1]=YEARS[key];
 const w=Math.max(300,Math.floor(el.clientWidth)),h=146,m={t:16,r:46,b:22,l:36};
 const base=BYRACE[key].filter(r=>!r.none&&!r.virtual&&r.secs);
 const ss=sexes().map(s=>({s,pts:base.filter(r=>r.sex===s).sort((a,b)=>a.year-b.year)}));
 const vals=ss.flatMap(o=>o.pts.map(p=>p.secs));
 const step=(Math.max(...vals)-Math.min(...vals))>1500?600:300;
 const lo=Math.floor((Math.min(...vals)-30)/step)*step,hi=Math.ceil((Math.max(...vals)+30)/step)*step;
 const x=d3.scaleLinear().domain([y0,y1]).range([m.l,w-m.r]);
 const y=d3.scaleLinear().domain([lo,hi]).range([m.t,h-m.b]);
 const svg=d3.select(el).append('svg').attr('width',w).attr('height',h).attr('role','img').attr('aria-label','Winning times by year for '+RACES[key].name+'. Faster times are higher.');
 const ticks=d3.range(lo,hi+1,step);
 svg.append('g').selectAll('line').data(ticks).join('line').attr('x1',m.l).attr('x2',w-m.r).attr('y1',d=>y(d)).attr('y2',d=>y(d)).attr('stroke',T.ink3).attr('stroke-opacity',.2);
 svg.append('g').selectAll('text').data(ticks).join('text').attr('x',m.l-6).attr('y',d=>y(d)+4).attr('text-anchor','end').attr('fill',T.ink3).attr('font-size',10.5).text(fmtHM);
 svg.append('text').attr('x',m.l-6).attr('y',8).attr('text-anchor','end').attr('fill',T.ink3).attr('font-size',9.5).text('↑ faster');
 const xt=d3.range(y0,y1+1).filter(v=>v%5===0||v===y0||v===y1).filter((v,i,a)=>!(v===y1&&i>0&&v-a[i-1]<3)&&!(v===y0&&a[i+1]-v<3));
 svg.append('g').selectAll('text').data(xt).join('text').attr('x',d=>x(d)).attr('y',h-6).attr('text-anchor','middle').attr('fill',T.ink3).attr('font-size',10.5).text(d=>d);
 const gaps=[...new Set(BYRACE[key].filter(r=>r.none||r.virtual).map(r=>r.year))];
 svg.append('g').selectAll('text').data(gaps).join('text').attr('x',d=>x(d)).attr('y',h-m.b+1).attr('text-anchor','middle').attr('fill',T.ink2).attr('font-size',12).attr('font-weight',700).text('×').append('title').text(d=>d+': no race (cancelled or virtual)');
 const line=d3.line().x(d=>x(d.year)).y(d=>y(d.secs));
 ss.forEach(o=>{const col=sexColor(o.s),pts=o.pts.filter(p=>!p.rec);
  svg.append('path').datum(o.pts).attr('d',line).attr('fill','none').attr('stroke',col).attr('stroke-width',2).attr('stroke-linejoin','round').attr('stroke-linecap','round');
  if(o.s==='M')svg.append('g').selectAll('circle').data(pts).join('circle').attr('cx',d=>x(d.year)).attr('cy',d=>y(d.secs)).attr('r',2.6).attr('fill',col);
  else svg.append('g').selectAll('rect').data(pts).join('rect').attr('x',d=>x(d.year)-2.4).attr('y',d=>y(d.secs)-2.4).attr('width',4.8).attr('height',4.8).attr('fill',col);
  const lp=o.pts[o.pts.length-1];if(lp)svg.append('text').attr('x',x(lp.year)+8).attr('y',y(lp.secs)+4).attr('fill',T.ink).attr('font-size',11).attr('font-weight',600).text(sexName(o.s));
 });
 const recs=ss.flatMap(o=>o.pts.filter(p=>p.rec));
 svg.append('g').selectAll('path').data(recs).join('path').attr('transform',d=>`translate(${x(d.year)},${y(d.secs)})`)
  .attr('d',d=>d.rec==='WR'?d3.symbol().type(d3.symbolDiamond).size(80)():d3.symbol().type(d3.symbolCircle).size(46)())
  .attr('fill',d=>d.rec==='WR'?T.ink:T.card).attr('stroke',d=>d.rec==='WR'?T.card:T.ink).attr('stroke-width',d=>d.rec==='WR'?1.5:2)
  .append('title').text(d=>`${d.name}, ${d.year}: ${fmt(d.secs)} — ${recTxt(d)}`);
 const mk=svg.append('g').attr('class','ymark');
 const hov=svg.append('g').style('display','none');
 hov.append('line').attr('y1',m.t).attr('y2',h-m.b).attr('stroke',T.ink2).attr('stroke-dasharray','3 3');
 const ov=svg.append('rect').attr('x',m.l-8).attr('y',0).attr('width',w-m.l-m.r+16).attr('height',h-m.b+8).attr('fill','transparent').style('cursor','crosshair');
 const yrAt=ev=>{const b=svg.node().getBoundingClientRect(),px=(ev.clientX-b.left)*(w/b.width);return Math.max(y0,Math.min(y1,Math.round(x.invert(px))))};
 ov.on('pointermove',ev=>{const yr=yrAt(ev);
   if(ev.pointerType==='mouse'&&!ev.buttons){hov.style('display',null).select('line').attr('x1',x(yr)).attr('x2',x(yr));
     const rows=yearRows(key,yr).filter(r=>!r.none),none=BYRACE[key].find(r=>r.year===yr&&r.none);
     showTip(ev.clientX,ev.clientY,`<b>${yr}</b>${rows.length?rows.map(r=>winLine(r,false)).join(''):`<div class="wr none">${none?'No race — '+esc(none.note):'No edition in data'}</div>`}`)}
   else{hideTip();if(yr!==state.year)setYear(yr)}})
  .on('pointerdown',ev=>{const yr=yrAt(ev);if(yr!==state.year)setYear(yr)})
  .on('pointerleave',()=>{hov.style('display','none');hideTip()});
 CH={svg,x,y,ss,mk,m,h,w};
}
function drawYearMark(){
 if(!CH)return;const {mk,x,y,ss,m,h}=CH,yr=state.year;mk.selectAll('*').remove();
 mk.append('line').attr('x1',x(yr)).attr('x2',x(yr)).attr('y1',m.t).attr('y2',h-m.b).attr('stroke',T.g).attr('stroke-opacity',.9).attr('stroke-width',1.4);
 ss.forEach(o=>{const p=o.pts.find(q=>q.year===yr);if(p)mk.append('circle').attr('cx',x(yr)).attr('cy',y(p.secs)).attr('r',5.5).attr('fill',sexColor(o.s)).attr('stroke',T.card).attr('stroke-width',2)});
}
function setYear(yr){state.year=yr;computeScene(false);updateYearUI()}

/* ---------- events ---------- */
document.addEventListener('click',e=>{
 const b=e.target.closest('[data-act]');if(!b)return;const a=b.dataset.act;
 if(a==='race')selectRace(b.dataset.key);
 else if(a==='close')clearSel();
 else if(a==='athlete')selectAthlete(dec(b.dataset.name));
 else if(a==='back')back();
 else if(a==='play'){playT?stopPlay():startPlay()}
 else if(a==='country'){const c=dec(b.dataset.c);state.country=state.country===c?null:c;computeScene(false);updateYearUI()}
});
document.addEventListener('input',e=>{if(e.target.id==='yr'){stopPlay();setYear(+e.target.value)}});
function syncSeg(){document.querySelectorAll('#segSex button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.sex===state.sex));document.querySelectorAll('#segOrg button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.org===state.org))}
function syncRot(){const r=$('#rot');if(r)r.setAttribute('aria-pressed',view.auto)}
function refresh(){computeScene(true);renderPanel();renderBans()}
$('#segSex').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;state.sex=b.dataset.sex;syncSeg();state.country=null;refresh()});
$('#segOrg').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;state.org=b.dataset.org;syncSeg();state.country=null;refresh()});
$('#rot').addEventListener('click',()=>{view.auto=!view.auto;if(view.auto)view.tw=null;syncRot()});
$('#theme').addEventListener('click',()=>{const light=getComputedStyle(document.documentElement).getPropertyValue('--mode').trim()==='light';document.documentElement.dataset.theme=light?'dark':'light';themeChanged()});
function themeChanged(){readTheme();computeScene(false);view.dirty=true;if(state.race&&!state.athlete){drawChart();drawYearMark()}}
if(window.matchMedia)matchMedia('(prefers-color-scheme: light)').addEventListener('change',()=>{if(!document.documentElement.dataset.theme)themeChanged()});
let rzT;window.addEventListener('resize',()=>{clearTimeout(rzT);rzT=setTimeout(fit,80)});

/* ---------- boot ---------- */
syncSeg();syncRot();setOpen();renderChips();computeScene(false);renderPanel();renderBans();fit();
requestAnimationFrame(tick);
const h0=location.hash.slice(1);if(RACES[h0])selectRace(h0,{fromHash:true});
})();
</script>
</body>
</html>
